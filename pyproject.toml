[project]
name = "adventofcode"
# CalVer: YY.N = the Nth release of 20YY (26.1, 26.2, ..., 27.1). Bumped by scripts/release.py.
version = "26.1"
description = 'Helper utilities for solving Advent of Code puzzles'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "Anže Pečar", email = "anze@pecar.me" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "requests",
  "percache",
  "beautifulsoup4",
  "python-dotenv",
  "rich",
]

[project.urls]
Documentation = "https://github.com/anze3db/adventofcode#readme"
Issues = "https://github.com/anze3db/adventofcode/issues"
Source = "https://github.com/anze3db/adventofcode"
Changelog = "https://github.com/anze3db/adventofcode/blob/main/CHANGELOG.md"
Mastodon = "https://fosstodon.org/@anze3db"
Twitter = "https://twitter.com/anze3db"

[project.scripts]
adventofcode = "adventofcode.cli:main"
aoc = "adventofcode.cli:main"

[dependency-groups]
dev = [
  "flakytest",
  "pytest>=8",
  "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  "S101", "PLR2004", "ISC001"
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["adventofcode"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
# The release script is shared with django-tui, potatoq and flakytest-python: keep it in sync rather than lint-clean
"scripts/release.py" = ["DTZ011", "EM101", "EM102", "FBT001", "FBT002", "PLR0917", "PLW2901", "S603", "T201"]
"tests/test_release_script.py" = ["ARG001", "ARG005", "PLC0415", "S603", "S607"]
